# Lints the agent-tooling Python in this repo (currently .claude/skills/*/*.py).
# Nothing here ships in an AppImage — the build sandbox has no Python — so this
# governs the scripts agents run against the fork and the code graphs.
line-length = 100
target-version = "py313"

[lint]
# Defaults (E4/E7/E9 + F) plus what actually bites in single-file scripts:
# bugbear (B), comprehensions (C4), isort (I), pyupgrade (UP), unused args (ARG).
# Deliberately NOT flake8-print (T20): these are CLI tools whose contract is to
# write results to stdout and progress to stderr — print is the interface, not a
# debugging leftover.
select = ["E", "F", "B", "C4", "I", "UP", "ARG"]
